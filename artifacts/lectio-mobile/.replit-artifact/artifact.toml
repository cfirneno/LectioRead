kind = "mobile"
previewPath = "/mobile/"
title = "Lectio Mobile"
version = "1.0.0"
id = "artifacts/lectio-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22567

[services.development]
run = "pnpm --filter @workspace/lectio-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lectio-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lectio-mobile", "run", "serve" ]

[services.env]
PORT = "22567"
BASE_PATH = "/mobile/"
