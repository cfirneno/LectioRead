kind = "web"
previewPath = "/"
title = "Lectio — Foreign Language Reader"
version = "1.0.0"
id = "artifacts/lectio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19814

[services.development]
run = "pnpm --filter @workspace/lectio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lectio", "run", "build" ]
publicDir = "artifacts/lectio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19814"
BASE_PATH = "/"
