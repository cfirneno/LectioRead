openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Lectio — Foreign Language Reader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: texts
    description: Text/book operations
  - name: paragraphs
    description: Paragraph operations
  - name: progress
    description: Reading progress operations
  - name: subscription
    description: Subscription and billing operations
  - name: visits
    description: Site visit tracking and analytics
  - name: outreach
    description: Educator outreach records
  - name: admin
    description: Admin access checks

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /texts/search:
    post:
      operationId: searchText
      tags: [texts]
      summary: Search for an open-source text
      description: Uses AI to find the best open-source version of a requested work and return its paragraphs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextSearchRequest"
      responses:
        "200":
          description: Text found and returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Text"
        "400":
          description: Bad request

  /texts:
    get:
      operationId: listTexts
      tags: [texts]
      summary: List all saved texts
      responses:
        "200":
          description: List of texts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Text"

  /texts/recent:
    get:
      operationId: getRecentTexts
      tags: [texts]
      summary: Get recently accessed texts with progress
      responses:
        "200":
          description: Recent texts with progress info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TextWithProgress"

  /texts/{textId}:
    get:
      operationId: getText
      tags: [texts]
      summary: Get a single text by ID
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Text details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Text"
        "404":
          description: Not found

  /texts/{textId}/paragraphs:
    get:
      operationId: listParagraphs
      tags: [paragraphs]
      summary: List all paragraphs for a text with completion status
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of paragraphs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParagraphSummary"

  /texts/{textId}/paragraphs/{index}:
    get:
      operationId: getParagraph
      tags: [paragraphs]
      summary: Get a specific paragraph (original text only)
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paragraph details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paragraph"
        "404":
          description: Not found

  /lookup:
    get:
      operationId: lookupWord
      tags: [paragraphs]
      summary: Look up morphology / parse data for a single word (Perseus for Latin/Greek)
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          description: Language label as stored on the text (e.g. "Latin", "Ancient Greek")
        - name: word
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordLookup"

  /texts/{textId}/paragraphs/{index}/interlinear:
    post:
      operationId: getInterlinearTranslation
      tags: [paragraphs]
      summary: Generate or retrieve the interlinear (word-for-word) translation
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationOptions"
      responses:
        "200":
          description: Interlinear translation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterlinearTranslation"
        "404":
          description: Not found

  /texts/{textId}/paragraphs/{index}/translation:
    post:
      operationId: getFullTranslation
      tags: [paragraphs]
      summary: Generate or retrieve the full literary translation
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationOptions"
      responses:
        "200":
          description: Full literary translation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullTranslation"
        "404":
          description: Not found

  /texts/{textId}/paragraphs/{index}/quiz:
    post:
      operationId: getQuiz
      tags: [paragraphs]
      summary: Generate or retrieve the cached quiz for a paragraph (6 MC questions)
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz questions (without correct answers)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuiz"

  /texts/{textId}/paragraphs/{index}/quiz/grade:
    post:
      operationId: gradeQuiz
      tags: [paragraphs]
      summary: Submit answers and receive a score plus per-question feedback
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmission"
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /review:
    get:
      operationId: getReview
      tags: [progress]
      summary: Aggregated weak items and quiz statistics for the current user
      responses:
        "200":
          description: Review summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"

  /texts/{textId}/paragraphs/{index}/scansion:
    post:
      operationId: getScansion
      tags: [paragraphs]
      summary: Generate or retrieve scansion marks (macrons/breves) for a verse paragraph
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scansion-marked text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scansion"
        "404":
          description: Not found

  /texts/{textId}/paragraphs/{index}/audio:
    post:
      operationId: getParagraphAudio
      tags: [paragraphs]
      summary: Generate or retrieve spoken audio of a paragraph in its original language
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Spoken audio of the paragraph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParagraphAudio"
        "404":
          description: Not found

  /texts/{textId}/stats:
    get:
      operationId: getTextStats
      tags: [texts]
      summary: Get reading stats for a text
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reading stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextStats"

  /texts/{textId}/vocabulary:
    get:
      operationId: getTextVocabulary
      tags: [texts]
      summary: Running vocabulary list of words seen so far in this text
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vocabulary list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyList"

  /texts/{textId}/flashcards:
    get:
      operationId: getTextFlashcards
      tags: [texts]
      summary: Vocabulary flashcards for words seen so far in this text
      parameters:
        - name: textId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flashcard deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"

  /progress:
    get:
      operationId: listProgress
      tags: [progress]
      summary: List all reading progress records
      responses:
        "200":
          description: All progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Progress"
    post:
      operationId: saveProgress
      tags: [progress]
      summary: Mark a paragraph as completed or reset it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"

  /visits:
    post:
      operationId: recordVisit
      tags: [visits]
      summary: Record a site visit
      description: Logs a page visit. Public — no authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "200":
          description: Visit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitAck"

  /visits/stats:
    get:
      operationId: getVisitStats
      tags: [visits]
      summary: Get aggregate visit statistics
      description: Returns total visits, unique visitors, and visits in the last 24 hours and 7 days.
      responses:
        "200":
          description: Visit statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitStats"

  /visits/recent:
    get:
      operationId: getRecentVisits
      tags: [visits]
      summary: Get the most recent site visits
      description: Returns the latest individual visits with their time, source, referrer and path.
      responses:
        "200":
          description: Recent visits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentVisits"

  /outreach/recipients:
    get:
      operationId: getOutreachRecipients
      tags: [outreach]
      summary: List the educator outreach recipients
      description: Admin only. Returns every institution/email that the outreach announcement was sent to, with the send time.
      responses:
        "200":
          description: Outreach recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachRecipients"
        "401":
          description: Not signed in
        "403":
          description: Not an admin

  /admin/me:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Whether the current user may view the dashboard
      description: Returns admin=true when the signed-in user is on the admin allowlist.
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"

  /subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to the Lectio newsletter
      description: Public — adds an email to the subscriber list. Idempotent on email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSignupInput"
      responses:
        "200":
          description: Subscribed (or already subscribed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterAck"
        "400":
          description: Invalid email

  /subscription/me:
    get:
      operationId: getSubscriptionStatus
      tags: [subscription]
      summary: Get current user's subscription status
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "401":
          description: Unauthorized

  /donate/checkout:
    post:
      operationId: createDonationCheckout
      tags: [donate]
      summary: Create a Stripe Checkout session for a one-time donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationInput"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrl"
        "400":
          description: Invalid donation amount

  /subscription/portal:
    post:
      operationId: createBillingPortalSession
      tags: [subscription]
      summary: Create a Stripe billing portal session
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrl"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    VisitInput:
      type: object
      required: [visitorId, path]
      properties:
        visitorId:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable per-browser identifier (random, stored in localStorage)
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: The path that was visited
        referrer:
          type: ["string", "null"]
          maxLength: 1024
          description: document.referrer, if any
        source:
          type: ["string", "null"]
          maxLength: 64
          description: Campaign/source tag from the URL (e.g. "outreach" from ?from=outreach)

    VisitAck:
      type: object
      required: [recorded]
      properties:
        recorded:
          type: boolean

    NewsletterSignupInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Email address to subscribe
        source:
          type: ["string", "null"]
          maxLength: 64
          description: Where the signup came from (e.g. "educators")

    NewsletterAck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    VisitStats:
      type: object
      required: [total, uniqueVisitors, last24h, last7d]
      properties:
        total:
          type: integer
          description: All-time visit count
        uniqueVisitors:
          type: integer
          description: Distinct visitor count
        last24h:
          type: integer
          description: Visits in the last 24 hours
        last7d:
          type: integer
          description: Visits in the last 7 days
        bySource:
          type: array
          description: Visit breakdown grouped by source tag (untagged visits grouped as "direct")
          items:
            type: object
            required: [source, visits, uniqueVisitors]
            properties:
              source:
                type: string
                description: The source tag, or "direct" for untagged visits
              visits:
                type: integer
              uniqueVisitors:
                type: integer

    RecentVisits:
      type: object
      required: [visits]
      properties:
        visits:
          type: array
          items:
            type: object
            required: [id, at, source, referrer, path]
            properties:
              id:
                type: integer
              at:
                type: string
                format: date-time
                description: When the visit happened (UTC)
              source:
                type: ["string", "null"]
                description: Source tag from the URL, or null if untagged
              referrer:
                type: ["string", "null"]
                description: The page the visitor came from, if any
              path:
                type: string
                description: The path that was visited

    AdminStatus:
      type: object
      required: [admin]
      properties:
        admin:
          type: boolean
          description: Whether the current user may view the dashboard

    OutreachRecipients:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: array
          items:
            type: object
            required: [email, institution, department, country, status, sentAt]
            properties:
              email:
                type: string
              institution:
                type: string
              department:
                type: string
              country:
                type: string
              status:
                type: string
                description: Send status (e.g. "sent")
              sentAt:
                type: string
                format: date-time
                description: When the announcement was sent (UTC)

    TextSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: "e.g. 'The Prince by Machiavelli, chapter 1'"

    TranslationOptions:
      type: object
      properties:
        language:
          type: string
          description: "Target gloss/translation language (defaults to the text's target language / English)"

    Text:
      type: object
      required: [id, title, author, language, sourceUrl, paragraphCount, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        language:
          type: string
          description: "e.g. 'Italian', 'Latin', 'French'"
        targetLanguage:
          type: ["string", "null"]
          description: "The language to translate to, e.g. 'English'"
        sourceUrl:
          type: ["string", "null"]
          description: "URL of the open-source text"
        description:
          type: ["string", "null"]
        paragraphCount:
          type: integer
        publicationYear:
          type: ["integer", "null"]
          description: "Approximate publication year (negative for BCE, e.g. -750 for 750 BCE)"
        englishTitle:
          type: ["string", "null"]
          description: "Commonly used English title (e.g. 'Crime and Punishment' for 'Преступление и наказание')"
        englishAuthor:
          type: ["string", "null"]
          description: "Author's name in Latin script as commonly used in English (e.g. 'Fyodor Dostoevsky')"
        catalogKey:
          type: ["string", "null"]
          description: "Stable catalog identifier for seeded texts (e.g. 'Aeneis'), used for deep links"
        nationality:
          type: ["string", "null"]
          description: "For English texts: 'British' or 'American', used to split the library"
        createdAt:
          type: string

    TextWithProgress:
      type: object
      required: [id, title, author, language, paragraphCount, completedCount, lastAccessedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        language:
          type: string
        paragraphCount:
          type: integer
        completedCount:
          type: integer
        lastParagraphIndex:
          type: ["integer", "null"]
        lastAccessedAt:
          type: ["string", "null"]

    TextStats:
      type: object
      required: [textId, totalParagraphs, completedParagraphs, percentComplete]
      properties:
        textId:
          type: integer
        totalParagraphs:
          type: integer
        completedParagraphs:
          type: integer
        percentComplete:
          type: number

    ParagraphSummary:
      type: object
      required: [id, textId, index, originalText, completed]
      properties:
        id:
          type: integer
        textId:
          type: integer
        index:
          type: integer
        originalText:
          type: string
        completed:
          type: boolean

    Paragraph:
      type: object
      required: [id, textId, index, originalText, completed]
      properties:
        id:
          type: integer
        textId:
          type: integer
        index:
          type: integer
        originalText:
          type: string
        completed:
          type: boolean
        interlinearTranslation:
          type: ["string", "null"]
          description: "Cached interlinear translation"
        fullTranslation:
          type: ["string", "null"]
          description: "Cached full literary translation"

    VocabularyEntry:
      type: object
      required: [original, translation, count, firstParagraphIndex]
      properties:
        original:
          type: string
        translation:
          type: string
        count:
          type: integer
        firstParagraphIndex:
          type: integer

    VocabularyList:
      type: object
      required: [textId, throughParagraphIndex, entries]
      properties:
        textId:
          type: integer
        throughParagraphIndex:
          type: integer
          description: Highest paragraph index included in the aggregation (-1 if none)
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyEntry"

    Flashcard:
      type: object
      required: [word, definition, icon, inflection, count, firstParagraphIndex]
      properties:
        word:
          type: string
          description: The word as it appears in the text
        definition:
          type: string
          description: Short English definition (headword meaning)
        icon:
          type: string
          description: A single emoji memory hook
        inflection:
          type: string
          description: Grammatical form of the word (may be empty)
        count:
          type: integer
        firstParagraphIndex:
          type: integer

    FlashcardDeck:
      type: object
      required: [textId, throughParagraphIndex, cards]
      properties:
        textId:
          type: integer
        throughParagraphIndex:
          type: integer
          description: Highest paragraph index included (-1 if none)
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Flashcard"

    PublicQuizQuestion:
      type: object
      required: [id, kind, prompt, options]
      properties:
        id:
          type: integer
        kind:
          type: string
          description: "translation | vocab | grammar"
        prompt:
          type: string
        options:
          type: array
          items:
            type: string

    PublicQuiz:
      type: object
      required: [textId, paragraphIndex, paragraphText, questions]
      properties:
        textId:
          type: integer
        paragraphIndex:
          type: integer
        paragraphText:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/PublicQuizQuestion"

    QuizAnswer:
      type: object
      required: [id, chosenIndex]
      properties:
        id:
          type: integer
        chosenIndex:
          type: integer

    QuizSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"

    QuizResultItem:
      type: object
      required: [id, kind, prompt, options, correctIndex, chosenIndex, correct, explanation]
      properties:
        id:
          type: integer
        kind:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        chosenIndex:
          type: integer
        correct:
          type: boolean
        explanation:
          type: string

    QuizResult:
      type: object
      required: [textId, paragraphIndex, score, total, items]
      properties:
        textId:
          type: integer
        paragraphIndex:
          type: integer
        score:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizResultItem"

    ReviewWeakItem:
      type: object
      required: [kind, prompt, missedCount, lastSeenAt]
      properties:
        kind:
          type: string
        prompt:
          type: string
        explanation:
          type: string
        correctAnswer:
          type: string
        missedCount:
          type: integer
        lastSeenAt:
          type: string
        textId:
          type: integer
        paragraphIndex:
          type: integer
        textTitle:
          type: string

    ReviewSummary:
      type: object
      required: [totalAttempts, totalScore, totalPossible, weakItems]
      properties:
        totalAttempts:
          type: integer
        totalScore:
          type: integer
        totalPossible:
          type: integer
        weakItems:
          type: array
          items:
            $ref: "#/components/schemas/ReviewWeakItem"

    WordLookupAnalysis:
      type: object
      required: [features]
      properties:
        lemma:
          type: string
        features:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: string

    WordLookup:
      type: object
      required: [word, language, source, sourceUrl, analyses]
      properties:
        word:
          type: string
        language:
          type: string
        source:
          type: string
          description: "perseus | ai | wiktionary | none"
        sourceUrl:
          type: string
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/WordLookupAnalysis"

    InterlinearWord:
      type: object
      required: [original, translation]
      properties:
        original:
          type: string
        translation:
          type: string
        transliteration:
          type: string
          description: Romanized pronunciation for non-Latin scripts (Greek, Cyrillic, etc.). Omitted for Latin-script languages.

    InterlinearTranslation:
      type: object
      required: [paragraphId, words, originalText]
      properties:
        paragraphId:
          type: integer
        originalText:
          type: string
        words:
          type: array
          items:
            $ref: "#/components/schemas/InterlinearWord"

    FullTranslation:
      type: object
      required: [paragraphId, originalText, translatedText]
      properties:
        paragraphId:
          type: integer
        originalText:
          type: string
        translatedText:
          type: string

    Scansion:
      type: object
      required: [paragraphId, originalText, scannedText]
      properties:
        paragraphId:
          type: integer
        originalText:
          type: string
        scannedText:
          type: string

    ParagraphAudio:
      type: object
      required: [paragraphId, format, audioBase64]
      properties:
        paragraphId:
          type: integer
        format:
          type: string
        audioBase64:
          type: string

    Progress:
      type: object
      required: [id, textId, paragraphIndex, completed, updatedAt]
      properties:
        id:
          type: integer
        textId:
          type: integer
        paragraphIndex:
          type: integer
        completed:
          type: boolean
        updatedAt:
          type: string

    ProgressInput:
      type: object
      required: [textId, paragraphIndex, completed]
      properties:
        textId:
          type: integer
        paragraphIndex:
          type: integer
        completed:
          type: boolean

    SubscriptionStatus:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        status:
          type: string
          nullable: true

    CheckoutUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string

    DonationInput:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          minimum: 100
          maximum: 1000000
          description: "Donation amount in US cents (min $1, max $10,000)."
